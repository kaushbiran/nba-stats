[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nba-stats"
version = "0.1.0"
description = "NBA Watcher — query completed NBA seasons from a local database"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["nba_api>=1.10.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
nbastats = "nbastats.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nbastats = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
